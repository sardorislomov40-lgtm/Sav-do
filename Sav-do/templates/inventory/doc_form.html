{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1 class="h1 mb-5">{{ title }}</h1>
<form method="post" class="card grid max-w-xl gap-4 p-4">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}{% include "partials/_field.html" with field=field %}{% endfor %}
  <div class="flex gap-3">
    <button class="btn btn-primary">Davom etish</button>
    <a class="btn" href="{% url back %}">Bekor qilish</a>
  </div>
</form>
{% endblock %}
